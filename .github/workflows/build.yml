name: Build iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for Simulator
        run: |
          set -o pipefail
          xcodebuild -project MotoLog.xcodeproj -scheme MotoLog \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build | tail -n 40

      - name: Build unsigned IPA (device)
        run: |
          set -o pipefail
          xcodebuild -project MotoLog.xcodeproj -scheme MotoLog \
            -sdk iphoneos -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 40
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MotoLog.app Payload/
          zip -qr MotoLog-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: MotoLog-unsigned-ipa
          path: MotoLog-unsigned.ipa

      - name: Publish latest release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MotoLog-unsigned.ipa --title "MotoLog (ultima build)" \
            --notes "Build automatica del commit ${GITHUB_SHA::7}. IPA non firmato: va firmato con Sideloadly/AltStore/SideStore."
